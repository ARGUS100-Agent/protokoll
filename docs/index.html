/* Wochenbericht */
function weekReportHTML(ws) {
  const keys = Array.from({ length: 7 }, (_, i) => addDays(ws, i));
  const isCur = ws === weekStart(todayKey());
  const nav = `<div class="week-nav"><button class="icon-btn" data-a="week" data-d="-7" aria-label="Vorherige Woche">${icon('chevron-left')}</button><span>${esc(fmtDate(ws, { day: 'numeric', month: 'short' }))} – ${esc(fmtDate(addDays(ws, 6), { day: 'numeric', month: 'short' }))}</span><button class="icon-btn" data-a="week" data-d="7" ${isCur ? 'disabled' : ''} aria-label="Nächste Woche">${icon('chevron-right')}</button></div>`;
  const past = keys.filter((k) => k <= todayKey());
  const lk = loggedKeys(past);
  if (!lk.length && !past.some((k) => peekDay(k))) return `<section class="sec report"><div class="sec-head"><h2>Wochenbericht</h2></div>${nav}<p class="sec-sub">Für diese Woche gibt es noch keine Einträge.</p></section>`;
  const t = T();
  const flags = past.map((k) => dayFlags(k));
  const cnt = (f) => flags.filter(f).length;
  const evs = lk.map((k) => evaluate(k));
  const avg = (key) => mean(evs.map((e) => e.metrics[key].v));
  const wins = [], gaps = [];
  const pDays = evs.filter((e) => e.metrics.p.v >= (t.p.min || t.p.lo)).length;
  if (lk.length) {
    wins.push(`Protein-Minimum an ${pDays} von ${lk.length} Tagen`);
    const fibDays = evs.filter((e) => e.metrics.fib.v >= t.fib.lo).length; if (fibDays) wins.push(`Ballaststoffe ≥ ${t.fib.lo} g an ${fibDays} Tagen`);
    const fermDays = evs.filter((e) => e.metrics.ferm.v >= t.ferm.lo).length; if (fermDays) wins.push(`Fermentiertes ≥ ${t.ferm.lo} Portionen an ${fermDays} Tagen`);
  }
  const sDays = cnt((f) => f.supp); if (sDays) wins.push(`Supplements komplett an ${sDays} Tagen`);
  const hDays = cnt((f) => f.habits); if (hDays) wins.push(`Gewohnheiten-Ziel an ${hDays} Tagen`);
  const plants = weekPlants(addDays(ws, 6), false).size;
  if (plants >= t.plants.lo) wins.push(`${plants} verschiedene Pflanzen (Ziel ${t.plants.lo})`);
  else gaps.push({ t: `Pflanzenvielfalt: ${plants} von ${t.plants.lo}`, tip: 'Beeren im Wechsel, Vielfalt-Posten und Kräuter einplanen' });
  if (lk.length) {
    for (const key of MICRO_KEYS.concat(['fib', 'p', 'kcal'])) {
      const a = avg(key), mt = targetFor(key);
      if (mt.lo && a < mt.lo * 0.9) {
        const s = suggestFood(key, mt.lo - a);
        gaps.push({ t: `${metaOf(key).n} im Schnitt ${fmt((a / mt.lo) * 100)} %`, tip: s ? `+ ${friendlyTipAmount(s.food, s.g)} pro Tag` : '' });
      }
      const maxV = key === 'va' ? mean(evs.map((e) => e.act.tot.ret || 0)) : a;
      if (mt.max && maxV > mt.max) gaps.push({ t: `${metaOf(key).n} im Schnitt über dem Maximum (${fmt(disp(key, maxV), metaOf(key).d)} ${metaOf(key).u})`, tip: 'Obergrenzen gelten für die dauerhafte Zufuhr' });
    }
  }
  const hk = (f) => mean(past.map((k) => (peekDay(k) && peekDay(k).health ? peekDay(k).health[f] : null)).filter((v) => v != null));
  const prevKeys = Array.from({ length: 7 }, (_, i) => addDays(ws, i - 7));
  const hkPrev = (f) => mean(prevKeys.map((k) => (peekDay(k) && peekDay(k).health ? peekDay(k).health[f] : null)).filter((v) => v != null));
  const stat = (f, n, d = 0, u = '') => { const a = hk(f); if (a == null) return ''; const b = hkPrev(f); const diff = b != null ? a - b : null; return `<div class="kv"><span>${n}</span><b>${fmt(a, d)}${u}</b>${diff != null && Math.abs(diff) >= 0.05 ? `<small>${diff > 0 ? '+' : ''}${fmt(diff, d)} vs. Vorwoche</small>` : ''}</div>`; };
  const skinA = mean(past.map((k) => (peekDay(k) && peekDay(k).skin ? peekDay(k).skin.score : null)).filter((v) => v != null));
  return `<section class="sec report"><div class="sec-head"><h2>Wochenbericht</h2><span class="count">${lk.length}/7 Tage mit Ernährung</span></div>${nav}
    <div class="kv-grid">${lk.length ? `<div class="kv"><span>Ø Kalorien</span><b>${fmt(avg('kcal'))}</b></div><div class="kv"><span>Ø Protein</span><b>${fmt(avg('p'))} g</b></div>` : ''}${stat('sleepScore', 'Ø Sleep Score')}${stat('hrv', 'Ø HRV', 0, ' ms')}${stat('rhr', 'Ø Ruhepuls')}${stat('steps', 'Ø Schritte')}${skinA != null ? `<div class="kv"><span>Ø Hautbild</span><b>${fmt(skinA, 1)}</b></div>` : ''}</div>
    ${wins.length ? `<h5>Erfolge</h5><ul class="wins">${wins.map((w) => `<li>${icon('check')}${esc(w)}</li>`).join('')}</ul>` : ''}
    ${gaps.length ? `<h5>Lücken</h5><ul class="gaps">${gaps.slice(0, 6).map((g) => `<li>${icon('arrow-down')}<span>${esc(g.t)}${g.tip ? `<small>${esc(g.tip)}</small>` : ''}</span></li>`).join('')}</ul>` : '<p class="sec-sub">Keine Lücken im Wochenschnitt.</p>'}
  </section>`;
}

/* Kalender-Heatmap */
const HEAT_RAMP = ['#24304C', '#2E4677', '#3B60A4', '#5A84D8', '#9DB2FF'];
const HEAT_METRICS = { nutri: 'Ernährung', supp: 'Supplements', habits: 'Gewohnheiten', sleep: 'Sleep Score', skin: 'Hautbild' };
function heatValue(k, metric) {
  const d = peekDay(k);
  if (!d) return null;
  if (metric === 'sleep') return d.health.sleepScore != null ? d.health.sleepScore / 100 : null;
  if (metric === 'skin') return d.skin && d.skin.score != null ? d.skin.score / 10 : null;
  const f = dayFlags(k);
  if (metric === 'nutri') return f.score != null ? f.score / 100 : null;
  if (metric === 'supp') return hasData(d) ? f.suppFrac : null;
  if (metric === 'habits') return f.habitCount ? f.habitCount / f.habitTotal : null;
  return null;
}
function heatLabel(k, metric, v) {
  if (v == null) return 'keine Daten';
  if (metric === 'sleep') return `Sleep Score ${fmt(v * 100)}`;
  if (metric === 'skin') return `Hautbild ${fmt(v * 10)}`;
  if (metric === 'nutri') return `Score ${fmt(v * 100)}`;
  return `${fmt(v * 100)} %`;
}
function heatmapHTML() {
  const [y, m] = ui.heatMonth.split('-').map(Number);
  const first = `${y}-${pad(m)}-01`;
  const days = new Date(y, m, 0).getDate();
  const off = weekday(first);
  const metric = ui.heatMetric;
  let cells = WD_SHORT.map((w) => `<span class="hm-h">${w}</span>`).join('');
  for (let i = 0; i < off; i++) cells += '<span class="hm-x"></span>';
  for (let dd = 1; dd <= days; dd++) {
    const k = `${y}-${pad(m)}-${pad(dd)}`;
    const v = k > todayKey() ? null : heatValue(k, metric);
    const step = v == null ? -1 : Math.min(4, Math.floor(v * 5 - 1e-9));
    const bg = step < 0 ? '' : `background:${HEAT_RAMP[Math.max(0, step)]}`;
    cells += `<button class="hm-c${step < 0 ? ' is-empty' : ''}${k === todayKey() ? ' is-today' : ''}${step >= 3 ? ' is-hi' : ''}" style="${bg}" data-a="heat-day" data-date="${k}" data-tip="${esc(fmtDate(k, { weekday: 'short', day: 'numeric', month: 'short' }) + '\n' + heatLabel(k, metric, v))}">${dd}</button>`;
  }
  const monthName = new Date(y, m - 1, 15).toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });
  const isCur = ui.heatMonth >= todayKey().slice(0, 7);
  return `<section class="sec"><div class="sec-head"><h2>Kalender</h2></div>
    <div class="chips chips-scroll">${Object.entries(HEAT_METRICS).map(([id, n]) => `<button class="chip chip-sm${metric === id ? ' is-on' : ''}" data-a="heat-metric" data-v="${id}">${n}</button>`).join('')}</div>
    <div class="week-nav"><button class="icon-btn" data-a="heat-month" data-d="-1" aria-label="Vorheriger Monat">${icon('chevron-left')}</button><span>${esc(monthName)}</span><button class="icon-btn" data-a="heat-month" data-d="1" ${isCur ? 'disabled' : ''} aria-label="Nächster Monat">${icon('chevron-right')}</button></div>
    <div class="heatmap">${cells}</div>
    <div class="hm-legend"><span>niedrig</span>${HEAT_RAMP.map((c) => `<i style="background:${c}"></i>`).join('')}<span>hoch</span></div>
    ${monthSummary(y, m, days)}
  </section>`;
}

function monthSummary(y, m, days) {
  const keys = Array.from({ length: days }, (_, i) => `${y}-${pad(m)}-${pad(i + 1)}`).filter((k) => k <= todayKey() && peekDay(k));
  if (!keys.length) return '<p class="hint">In diesem Monat gibt es noch keine Einträge.</p>';
  const flags = keys.map((k) => dayFlags(k));
  const logged = keys.filter((k) => hasData(peekDay(k)));
  const score = mean(flags.map((f) => f.score).filter((v) => v != null));
  const sleep = mean(keys.map((k) => peekDay(k).health.sleepScore).filter((v) => v != null));
  const w = keys.map((k) => peekDay(k).health.weight).filter((v) => v != null);
  const kv = (l, v, s = '') => `<div class="kv"><span>${l}</span><b>${v}</b>${s ? `<small>${s}</small>` : ''}</div>`;
  return `<h5>Monatsübersicht</h5><div class="kv-grid">
    ${kv('Tage mit Ernährung', logged.length, `Ziele erreicht an ${flags.filter((f) => f.nutri).length}`)}
    ${kv('Ø Ernährungs-Score', score != null ? fmt(score) : '–')}
    ${kv('Supplements komplett', `${flags.filter((f) => f.supp).length} Tage`)}
    ${kv('Gewohnheiten-Ziel', `${flags.filter((f) => f.habits).length} Tage`)}
    ${sleep != null ? kv('Ø Sleep Score', fmt(sleep)) : ''}
    ${w.length >= 2 ? kv('Gewicht', `${w[w.length - 1] - w[0] > 0 ? '+' : ''}${fmt(w[w.length - 1] - w[0], 1)} kg`, `${fmt(w[0], 1)} → ${fmt(w[w.length - 1], 1)} kg`) : ''}
  </div>`;
}

/* Nährstoffabdeckung (Durchschnitt) */
function coverageHTML(keys) {
  const lk = loggedKeys(keys);
  if (!lk.length) return chartCard('cov', 'Nährstoffabdeckung', 'Durchschnitt der Tage mit Ernährungsdaten.', emptyChart('Noch keine Ernährungsdaten im Zeitraum.'));
  const evs = lk.map((k) => evaluate(k));
  const rows = MICRO_KEYS.concat(['fib', 'pre', 'pp', 'ferm']).map((key) => {
    const a = mean(evs.map((e) => e.metrics[key].v));
    const t = targetFor(key);
    const ret = key === 'va' ? mean(evs.map((e) => e.act.tot.ret || 0)) : null;
    let stt = stateOf(a, key === 'va' ? { ...t, max: undefined } : t);
    if (key === 'va' && ret > t.max) stt = 'over';
    return { key, a, pct: t.lo ? (a / t.lo) * 100 : 0, st: stt };
  }).sort((x, y) => x.pct - y.pct);
  const body = `<div class="cov">${rows.map((r) => `<div class="cov-row st-${r.st}" data-tip="${esc(`${metaOf(r.key).n}\nØ ${fmt(disp(r.key, r.a), metaOf(r.key).d)} ${metaOf(r.key).u} (${fmt(r.pct)} %)\n${STATE_LABEL[r.st]}`)}"><span class="cov-n">${esc(MICRO_SHORT[r.key] || metaOf(r.key).n)}</span><span class="cov-bar"><i style="width:${clamp(r.pct / 2, 0, 100)}%"></i><em style="left:50%"></em></span><span class="cov-v">${icon(STATE_ICON[r.st])}${fmt(r.pct)} %</span></div>`).join('')}</div><p class="hint">Linie = 100 % des Ziels, Balken reichen bis 200 %.</p>`;
  const table = `<tr><th>Nährstoff</th><th>Ø</th><th>% Ziel</th><th>Status</th></tr>` + rows.map((r) => `<tr><td>${esc(metaOf(r.key).n)}</td><td>${fmt(disp(r.key, r.a), metaOf(r.key).d)} ${esc(metaOf(r.key).u)}</td><td>${fmt(r.pct)} %</td><td>${STATE_LABEL[r.st]}</td></tr>`).join('');
  return chartCard('cov', 'Nährstoffabdeckung', `Durchschnitt aus ${lk.length} ${lk.length === 1 ? 'Tag' : 'Tagen'} mit Ernährungsdaten.`, body, table);
}
function macrosHTML(keys) {

  const series = [{ key: 'p', name: 'Protein', color: SERIES.p }, { key: 'f', name: 'Fett', color: SERIES.f }, { key: 'c', name: 'Kohlenhydrate', color: SERIES.c }];

}
function movingAvg(vals, win = 7) {

function correlationsHTML() {

      const diff = r.ma - r.mb;
      txt = `<div class="corr-cmp"><div><b>${fmt(r.ma)}</b><small>Ø ${yName}, ${esc(c.la)} (${r.na})</small></div><div><b>${fmt(r.mb)}</b><small>Ø ${yName}, ${esc(c.lb)} (${r.nb})</small></div></div>
        <p class="corr-sum">${Math.abs(diff) < 1 ? 'Kaum Unterschied zwischen den Gruppen.' : `${esc(c.la)}: im Schnitt ${diff > 0 ? '+' : ''}${fmt(diff)} Punkte.`}${r.r != null ? ` Korrelation r = ${fmt(r.r, 2)}, ${strengthLabel(r.r)}.` : ''}</p>`;
    }
    h += `<div class="corr${open ? ' is-open' : ''}"><button class="corr-hit" data-a="expand" data-key="c:${c.id}"><span><b>${esc(c.n)}</b><small>→ ${yName} der Nacht danach</small></span>${icon(open ? 'chevron-down' : 'chevron-right', 'mrow-chev')}</button>${txt}
      ${open && r.pts.length >= 2 && c.type !== 'bool' ? `<div class="chart-box">${scatterChart({ pts: r.pts, xType: c.type, yName, xName: c.n })}</div>` : ''}</div>`;
  }
  return h + '</div></section>';
}
function skinProgressHTML(keys) {
  const phases = S.settings.skin.phases;
  const all = Object.keys(S.days).sort();
  const rows = phases.map((p) => {
    const ks = all.filter((k) => k >= p.start && k <= p.end);
    const sc = ks.map((k) => S.days[k].skin && S.days[k].skin.score).filter((v) => v != null);
    const sp = ks.map((k) => S.days[k].skin && S.days[k].skin.spots).filter((v) => v != null);
    return { p, n: sc.length, score: mean(sc), spots: mean(sp) };
  });
  const after = [], noAg = [];
  for (const k of all) {
    const prev = peekDay(addDays(k, -1)), d = S.days[k];
    if (!d.skin || d.skin.score == null || !prev) continue;
    (prev.checks && prev.checks.m_ag1 ? after : noAg).push(d.skin.score);
  }
  const vals = keys.map((k) => { const d = peekDay(k); return d && d.skin && d.skin.score != null ? d.skin.score : null; });
  if (!rows.some((r) => r.n) && !vals.some((v) => v != null)) return chartCard('skin', 'Haut-Protokoll', 'Bewerte dein Hautbild unter Gesundheit → Haut, dann siehst du hier den Verlauf je Phase.', emptyChart('Noch keine Hautbewertungen.'));
  const body = lineChart({ keys, series: [{ name: 'Hautbild', color: SERIES.one, vals, dots: true }], domain: [0, 10], fmtY: (v) => fmt(v, 1) });
  const tbl = `<div class="table-wrap"><table><tr><th>Phase</th><th>Ø Hautbild</th><th>Ø neue Pickel</th><th>Tage</th></tr>${rows.map((r) => `<tr><td>${esc(r.p.n)}</td><td>${r.score != null ? fmt(r.score, 1) : '–'}</td><td>${r.spots != null ? fmt(r.spots, 1) : '–'}</td><td>${r.n}</td></tr>`).join('')}</table></div>`;
  const ag = after.length >= 3 && noAg.length >= 3 ? `<p class="sec-sub">Hautbild am Tag nach AG1: Ø ${fmt(mean(after), 1)} (${after.length}) gegenüber Ø ${fmt(mean(noAg), 1)} ohne AG1 am Vortag (${noAg.length}).</p>` : '<p class="sec-sub">Vergleich „Tag nach AG1“ ab je 3 bewerteten Tagen.</p>';
  return `<section class="sec chart-card"><div class="sec-head"><h2>Haut-Protokoll</h2></div><div class="chart-box">${body}</div>${tbl}${ag}</section>`;
}

}
function toggleItem(id, k) {
  const found = findItem(id);
  if (!found) return;
  const before = getDay(k);
  const on = !before.checks[id];
  const food = FOOD[itemFoodId(found.it, before)];
  mutDay(k, (d) => { if (on) { d.checks[id] = 1; persistRotation(d, found.it); } else delete d.checks[id]; });

}

async function shareBackup() {
  await flush();
  const json = JSON.stringify(exportData());
  const name = `protokoll-backup-${todayKey()}.json`;
  let file = null;
  try { file = new File([json], name, { type: 'application/json' }); } catch (e) { file = null; }
  if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'Protokoll-Backup' }); markBackup(); toast('Backup erstellt'); render(); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
  markBackup(); toast('Backup gespeichert'); render();
}

  'pe-opt': (el) => { const it = planItem(el.dataset.b, Number(el.dataset.i)); if (!it) return; it.opt = !it.opt; if (!it.opt) delete it.opt; saveSettings(); },
  'pe-add': (el) => sheetPickFood(el.dataset.b),
  'pe-pick': (el) => {
    const f = FOOD[el.dataset.id], b = S.settings.plan.find((x) => x.id === ui.sheet.blockId);
    if (!f || !b) return;
    const u = f.u[0][0];
    b.items.push({ id: 'u_' + uid(), food: f.id, a: u === 'g' || u === 'ml' ? 100 : 1, u });
    closeSheet(); saveSettings(); toast(`${f.n} hinzugefügt`);
  },
  'week-var': (el) => { S.settings.weekPlan[Number(el.dataset.i)] = el.dataset.v; saveSettings(); },
  'food-new': (el) => sheetFoodEdit(null, { name: el.dataset.name || '', supp: !!el.dataset.supp }),
  'food-edit': (el) => sheetFoodEdit(el.dataset.id),
  'fe-supp': (el) => { ui.sheet.f.supp = el.dataset.v; $$('[data-a="fe-supp"]').forEach((b) => b.classList.toggle('is-on', b === el)); },
  'fe-flag': (el) => {
    const f = ui.sheet.f;
    if (el.dataset.f === 'fl') { if (f.fl) delete f.fl; else f.fl = 100; el.classList.toggle('is-on', !!f.fl); }
    else { f.tags = f.tags || []; const i = f.tags.indexOf('upf'); if (i >= 0) f.tags.splice(i, 1); else f.tags.push('upf'); el.classList.toggle('is-on', f.tags.includes('upf')); }
  },
  'fe-save': () => {
    const s = ui.sheet, f = s.f;
    const name = $('#fe-n').value.trim();
    if (!name) { toast('Bitte einen Namen eingeben'); return; }
    f.n = name; f.cat = $('#fe-cat').value;
    const v = {};
    $$('[data-fe]').forEach((inp) => { const n = parseNum(inp.value); if (n != null && n !== 0) v[inp.dataset.fe] = n; });
    f.v = v;
    if (f.base === 1) { const un = ($('#fe-u').value || 'Einheit').trim(); f.u = [[un, 1]]; }
    else {
      const un = ($('#fe-u').value || '').trim(), ug = parseNum($('#fe-ug').value);
      const baseU = f.fl ? 'ml' : 'g';
      f.u = un && ug ? [[un, ug], [baseU, 1]] : [[baseU, 1]];
      const pl = ($('#fe-pl').value || '').split(',').map((x) => x.trim()).filter(Boolean);
      if (pl.length) f.pl = pl.length === 1 ? pl[0] : pl; else delete f.pl;
      const pp = parseNum($('#fe-pp').value), pre = parseNum($('#fe-pre').value), fe = parseNum($('#fe-ferm').value);
      if (pp) f.pp = pp; else delete f.pp;
      if (pre) f.pre = pre; else delete f.pre;
      if (fe) f.ferm = fe; else delete f.ferm;
    }
    if (s.isNew || FOOD[f.id].custom) {
      const clean = { ...f }; delete clean.custom; delete clean.edited;
      const i = S.foods.custom.findIndex((x) => x.id === f.id);
      if (i >= 0) S.foods.custom[i] = clean; else S.foods.custom.push(clean);
    } else {
      const orig = FOODS.find((x) => x.id === f.id);
      const over = { v: {} };
      for (const k of EDIT_KEYS) { const a = orig.v[k] || 0, b = f.v[k] || 0; if (Math.abs(a - b) > 1e-9) over.v[k] = b; }
      for (const k of ['n', 'cat', 'u', 'pl', 'pp', 'pre', 'ferm', 'fl', 'tags', 'supp']) if (JSON.stringify(orig[k]) !== JSON.stringify(f[k])) over[k] = f[k] === undefined ? null : f[k];
      if (!Object.keys(over.v).length) delete over.v;
      if (Object.keys(over).length) S.foods.over[f.id] = over; else delete S.foods.over[f.id];
    }
    markDirty('foods'); buildFoodIndex(); invalidate(); closeSheet(); render(); toast('Gespeichert');
  },
  'fe-reset': () => { delete S.foods.over[ui.sheet.f.id]; markDirty('foods'); buildFoodIndex(); invalidate(); closeSheet(); render(); toast('Originalwerte wiederhergestellt'); },
  'fe-del': () => { if (!confirm('Dieses Lebensmittel löschen? Bereits eingetragene Mengen bleiben ohne Nährwerte.')) return; S.foods.custom = S.foods.custom.filter((x) => x.id !== ui.sheet.f.id); markDirty('foods'); buildFoodIndex(); invalidate(); closeSheet(); render(); },
  'skin-routine-add': () => { S.settings.skin.routine.push({ id: 'r_' + uid(), n: 'Neuer Punkt' }); saveSettings(); },
  'skin-routine-del': (el) => { S.settings.skin.routine.splice(Number(el.dataset.i), 1); saveSettings(); },
  'habit-onoff': (el) => { const id = el.dataset.id, off = S.settings.habitsOff; const i = off.indexOf(id); if (i >= 0) off.splice(i, 1); else off.push(id); saveSettings(); },
  'habit-goal': (el) => { S.settings.habitGoal = Number(el.dataset.v); saveSettings(); },
};

/* Eingabe während des Tippens */
const I = {
  search: (el) => { ui.q = el.value; const r = $('#results'); if (r) r.innerHTML = searchResults(); },
  'set-search': (el) => { ui.setQ = el.value; const box = $('#set-foods'); if (box) { const tmp = document.createElement('div'); tmp.innerHTML = SET_VIEWS.foods(); const nl = tmp.querySelector('#set-foods'); if (nl) box.innerHTML = nl.innerHTML; } },
  'pick-search': (el) => { const r = $('#pick-res'); if (r) r.innerHTML = pickResults(el.value); },
  'sheet-amt': (el) => { const n = parseNum(el.value); if (n != null && ui.sheet) { ui.sheet.amt = n; updateSheetPreview(); } },
};
function updateSheetPreview() {
  const s = ui.sheet, box = $('#sh-prev');
  if (!s || !box) return;
  if (s.type === 'item') { const { it } = findItem(s.id); const d = getDay(s.k); const food = FOOD[itemFoodId(it, d)]; box.innerHTML = nutPreview(food, s.amt * unitG(food, it.u)); }
  else if (s.type === 'food') { const food = FOOD[s.fid]; box.innerHTML = nutPreview(food, s.amt * unitG(food, s.unit)); }
}

/* Änderungen (beim Verlassen eines Feldes) – ohne komplettes Neuzeichnen, damit der Fokus bleibt */
function fieldMeta(key) { for (const g of HEALTH_FIELDS) for (const f of g.fields) if (f.k === key) return f; return null; }
const C = {
  'date-pick': (el) => { if (!el.value) return; ui.date = el.value > todayKey() ? todayKey() : el.value; render(); },
  choice: (el) => { mutDay(el.dataset.date, (d) => { d.choice[el.dataset.key] = el.value; }); render(); },
  health: (el) => {
    const k = el.dataset.date, key = el.dataset.k, f = fieldMeta(key);
    let v = el.value.trim();
    if (f && f.type === 'num') {
      if (v === '') v = null;
      else { v = parseNum(v); if (v == null || (f.min != null && v < f.min) || (f.max != null && v > f.max)) { toast(`${f.n}: Wert prüfen (${f.min}–${f.max})`); el.classList.add('bad'); return; } }
    } else if (v === '') v = null;
    el.classList.remove('bad');
    mutDay(k, (d) => { if (v == null) delete d.health[key]; else d.health[key] = v; if (key === 'weight' && v != null && k === todayKey()) { S.settings.profile.weight = v; markDirty('settings'); } });
    flashSaved(el);
    if (el.closest('.quick-health')) { const allSet = $$('.quick-health input').every((i) => i.value.trim()); if (allSet) render(); }
  },
  'health-dur': (el) => { const k = el.dataset.date, key = el.dataset.k; const v = timeToMin(el.value); mutDay(k, (d) => { if (v == null) delete d.health[key]; else d.health[key] = v; }); flashSaved(el); },
  'habit-detail': (el) => {
    const k = el.dataset.date, key = el.dataset.k, h = el.dataset.h, v = el.value || null;
    mutDay(k, (d) => {
      d.hd = d.hd || {};
      if (v == null) { delete d.hd[key]; return; }
      d.hd[key] = v;
      const m = timeToMin(v);
      if (h === 'koffein') { if (m <= cafWindow()[1]) d.habits.koffein = true; else delete d.habits.koffein; }
      if (h === 'mahlzeit') { if (m <= sleepMin() - 120) d.habits.mahlzeit = true; else delete d.habits.mahlzeit; }
    });
    render();
  },
  note: (el) => { mutDay(el.dataset.date, (d) => { d.note = el.value; }); flashSaved(el); },
  'skin-note': (el) => { mutDay(el.dataset.date, (d) => { d.skin = d.skin || {}; d.skin.note = el.value; }); flashSaved(el); },
  profile: (el) => {
    const k = el.dataset.k;
    let v = el.value.trim();
    if (['age', 'height', 'weight'].includes(k)) v = parseNum(v);
    if ((k === 'wake' || k === 'sleep') && !v) return;
    S.settings.profile[k] = v;
    saveSettings(false); flashSaved(el);
  },
  target: (el) => {
    const key = el.dataset.k, f = el.dataset.f;
    let v = parseNum(el.value);
    S.settings.targets[key] = S.settings.targets[key] || {};
    if (v == null) { if (f === 'lo' && ['kcal', 'p', 'fatPct'].includes(key)) { toast('Dieses Ziel braucht einen Wert'); el.value = numIn(key === 'vd' ? S.settings.targets[key][f] * 40 : S.settings.targets[key][f], 2); return; } delete S.settings.targets[key][f]; }
    else { if (key === 'vd') v = v / 40; S.settings.targets[key][f] = v; }
    saveSettings(false); flashSaved(el);
  },
  'plan-block': (el) => { const b = S.settings.plan.find((x) => x.id === el.dataset.id); if (!b) return; if (el.dataset.f === 'n') b.n = el.value.trim() || b.n; else b.time = el.value || null; saveSettings(false); flashSaved(el); },
  'pe-amt': (el) => { const it = planItem(el.dataset.b, Number(el.dataset.i)); const v = parseNum(el.value); if (!it || v == null || v < 0) { toast('Menge prüfen'); return; } it.a = v; saveSettings(false); flashSaved(el); },
  'pe-unit': (el) => { const it = planItem(el.dataset.b, Number(el.dataset.i)); if (!it) return; it.u = el.value; saveSettings(false); flashSaved(el); },
  'pe-av': (el) => { const it = planItem(el.dataset.b, Number(el.dataset.i)); const v = parseNum(el.value); if (!it || v == null) return; it.av[el.dataset.v] = v; saveSettings(false); flashSaved(el); },
  'skin-phase': (el) => {
    const p = S.settings.skin.phases[Number(el.dataset.i)], f = el.dataset.f;
    if (f === 'rules') p.rules = el.value.split('\n').map((x) => x.trim()).filter(Boolean);
    else if (f === 'block') p.block = el.value.split(',').map((x) => x.trim().toLowerCase()).filter(Boolean);
    else if (el.value) p[f] = el.value;
    saveSettings(false); flashSaved(el);
  },
  'skin-routine': (el) => { const r = S.settings.skin.routine[Number(el.dataset.i)]; if (!r) return; r.n = el.value.trim() || r.n; saveSettings(false); flashSaved(el); },
  'backup-import': (el) => {
    const file = el.files && el.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      let data;
      try { data = JSON.parse(reader.result); } catch (e) { toast('Datei ist kein gültiges Backup'); return; }
      if (!data || data.app !== 'protokoll' || typeof data.days !== 'object') { toast('Datei ist kein Protokoll-Backup'); return; }
      ui.sheet = { type: 'import', data };
      const n = Object.keys(data.days).length;
      openSheet(`<h3 class="sheet-title">Backup importieren</h3><p class="hint">Backup vom ${esc(data.exportedAt ? fmtDate(data.exportedAt.slice(0, 10), { day: 'numeric', month: 'long', year: 'numeric' }) : '?')} mit ${n} Tagen.</p>
        <div class="sheet-acts"><button class="btn is-accent" data-a="import-do" data-mode="merge">Zusammenführen</button><p class="hint">Fügt die Tage hinzu; gleiche Tage werden durch das Backup ersetzt. Deine Einstellungen bleiben.</p>
        <button class="btn is-danger" data-a="import-do" data-mode="replace">Alles ersetzen</button><p class="hint">Löscht alles auf diesem Gerät und übernimmt das Backup komplett.</p></div>`);
    };
    reader.readAsText(file);
    el.value = '';
  },
};

/* ---------- Tooltip für Diagramme ---------- */
function showTip(el) {
  const tip = $('#tip');
  const lines = el.dataset.tip.split('\n');
  tip.innerHTML = `<b>${esc(lines[0])}</b>${lines.slice(1).map((l) => `<span>${esc(l)}</span>`).join('')}`;
  tip.classList.add('show');
  const r = el.getBoundingClientRect();
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = r.left + r.width / 2 - tw / 2;
  x = clamp(x, 8, window.innerWidth - tw - 8);
  let y = r.top - th - 10;
  if (y < 8) y = r.bottom + 10;
  tip.style.transform = `translate(${Math.round(x)}px, ${Math.round(y)}px)`;
  const svg = el.closest('svg');
  $$('.xhair').forEach((l) => l.classList.remove('show'));
  if (svg && el.dataset.x) { const xl = svg.querySelector('.xhair'); if (xl) { xl.setAttribute('x1', el.dataset.x); xl.setAttribute('x2', el.dataset.x); xl.classList.add('show'); } }
}
function hideTip() { $('#tip').classList.remove('show'); $$('.xhair').forEach((l) => l.classList.remove('show')); }

function setupEvents() {
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-a]');
    if (!el || el.disabled) return;
    const fn = A[el.dataset.a];
    if (fn) { e.preventDefault(); fn(el, e); }
  });
  document.addEventListener('input', (e) => { const el = e.target.closest('[data-i]'); if (el && I[el.dataset.i]) I[el.dataset.i](el, e); });
  document.addEventListener('change', (e) => { const el = e.target.closest('[data-c]'); if (el && C[el.dataset.c]) C[el.dataset.c](el, e); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && ui.sheet) closeSheet();
    if (e.key === 'Enter' && e.target.id === 'plant-new') { const b = $('[data-a="plant-add-custom"]'); if (b) b.click(); }
    if (e.key === 'Enter' && e.target.id === 'todo-new') A['todo-add']();
  });
  document.addEventListener('pointerdown', (e) => { const el = e.target.closest('[data-tip]'); if (el) showTip(el); else if (!e.target.closest('#tip')) hideTip(); }, { passive: true });
  document.addEventListener('pointerover', (e) => { if (e.pointerType !== 'mouse') return; const el = e.target.closest('[data-tip]'); if (el) showTip(el); else hideTip(); }, { passive: true });
  window.addEventListener('scroll', hideTip, { passive: true });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { flush(); return; }
    try { if (navigator.serviceWorker) navigator.serviceWorker.getRegistration().then((r) => { if (r) r.update(); }).catch(() => {}); } catch (e) { /* egal */ }
    const t = todayKey();
    if (t !== ui.lastToday) { if (ui.date === ui.lastToday) ui.date = t; ui.weekOf = weekStart(t); ui.heatMonth = t.slice(0, 7); ui.lastToday = t; invalidate(); render(); }
    else if (ui.tab === 'heute') render();
  });
  window.addEventListener('pagehide', () => { flush(); });
}

/* ---- main.js ---- */
/* ============================================================
   START
   ============================================================ */
function registerSW() {
  if (!('serviceWorker' in navigator)) return;
  const local = ['localhost', '127.0.0.1'].includes(location.hostname);
  if (location.protocol !== 'https:' && !local) return;
  navigator.serviceWorker.register('./sw.js').then((reg) => {
    if (reg.waiting && navigator.serviceWorker.controller) { ui.updateReady = true; if (ui.tab === 'heute') render(); }
    reg.addEventListener('updatefound', () => {
      const nw = reg.installing;
      if (!nw) return;
      nw.addEventListener('statechange', () => {
        if (nw.state === 'installed' && navigator.serviceWorker.controller) { ui.updateReady = true; if (ui.tab === 'heute' && !ui.sheet) render(); }
      });
    });
  }).catch(() => { /* offline oder file:// */ });
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (ui.reloadRequested) location.reload(); });
}

(async function init() {
  try {
    await loadState();
  } catch (e) {
    S.settings = defaultSettings();
    S.meta = { schema: 1, createdAt: new Date().toISOString(), lastBackup: null, backupSnooze: null };
    S.foods = { custom: [], over: {} };
    S.days = {};
    buildFoodIndex();
  }
  setupEvents();
  render(false);
  if (S.meta.version !== APP_VERSION) {
    if (S.meta.version) setTimeout(() => toast(`Protokoll wurde auf Version ${APP_VERSION} aktualisiert`), 600);
    S.meta.version = APP_VERSION; markDirty('meta');
  }
  document.body.classList.add('ready');
  registerSW();
  setInterval(() => {
    if (document.hidden) return;
    const t = todayKey();
    if (t !== ui.lastToday) {
      if (ui.date === ui.lastToday) ui.date = t;
      ui.lastToday = t; ui.weekOf = weekStart(t); ui.heatMonth = t.slice(0, 7);
      invalidate();
      if (!ui.sheet) render();
      return;
    }
    if (ui.tab === 'heute' && !ui.sheet) { const a = $('#arc'); if (a) a.innerHTML = arcInner(); }
  }, 30000);
})();
